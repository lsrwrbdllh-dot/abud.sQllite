plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.abud.supermarket'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abud.supermarket.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
// Package the original accounting engine and SQL files, with no duplicate schema.
def engineDirectory = layout.buildDirectory.dir('accountingSources')
tasks.register('stageAccounting', Sync) {
    from(rootProject.file('../database')) {
        include '__init__.py', 'engine.py', 'build_schema.py', 'mobile_bridge.py', 'mobile_metadata.py', 'seed.sql', 'migrations/*.sql'
    }
    into(engineDirectory.map { it.dir('database') })
}
chaquopy {
    defaultConfig { version = '3.12'; extractPackages 'database' }
    sourceSets { main { srcDir(engineDirectory) } }
}
tasks.configureEach { task ->
    if (task.name.toLowerCase().contains('python') || task.name == 'preBuild') {
        task.dependsOn('stageAccounting')
    }
}
